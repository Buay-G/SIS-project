<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login | Gambella City EduPortal</title>
    <link rel="stylesheet" href="/assets/css/login.css" />
  </head>
  <body>
    <div class="brand-mark">
      <span>Gambella</span>
      <svg
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <rect x="3" y="12" width="4" height="9" rx="1" fill="currentColor" />
        <rect x="10" y="7" width="4" height="14" rx="1" fill="currentColor" />
        <rect x="17" y="3" width="4" height="18" rx="1" fill="currentColor" />
      </svg>
    </div>

    <div class="page">
      <main class="stage">
        <div class="card">
          <div class="card-photo" aria-hidden="true"></div>

          <div class="card-form">
            <div class="brand-header">
              <img
                src="/assets/images/town.jpg"
                alt="Gambella City Administration seal"
                class="logo"
              />
              <h1>Gambell City<br />Eduportal</h1>
            </div>

            <form id="loginForm">
              <label for="userId">Username&nbsp;:</label>
              <input
                type="text"
                id="userId"
                name="userId"
                required
                autocomplete="username"
              />

              <label for="password">Password&nbsp;:</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
              />

              <button type="submit">Login</button>
            </form>

            <p id="message" role="alert"></p>
          </div>
        </div>
      </main>

      <footer class="footer">
        <p>&copy; <span id="currentYear"></span> School Management System</p>
        <div class="footer-links">
          <a href="#">Privacy Policy</a> | <a href="#">Help Desk</a> |
          <a href="mailto:support@example.edu">Contact Support</a>
        </div>
        <div class="footer-contact">
          <div class="contact-item">
            <span class="icon-circle" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.5 3 3 3.4 2.5 4 2.5h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1.1l-2.2 2.2z"
                  fill="currentColor"
                />
              </svg>
            </span>
            <div>
              <strong>Phone</strong>
              <div>+251 917 453 212</div>
            </div>
          </div>
          <div class="contact-item">
            <span class="icon-circle" aria-hidden="true">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M12 3 3 10h2v10h5v-6h4v6h5V10h2L12 3z"
                  fill="currentColor"
                />
              </svg>
            </span>
            <div>
              <strong>Address</strong>
              <div>5440 Gambella City</div>
            </div>
          </div>
        </div>
      </footer>
    </div>

    <script>
      document.getElementById("currentYear").textContent =
        new Date().getFullYear();
    </script>
    <script src="/assets/js/auth.js"></script>
  </body>
</html>
