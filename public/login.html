<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | School Management System</title>
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
    <div class="login-container">
        <img src="/assets/images/login.jpg" alt="Gambella City EduPortal Logo" class="logo">
        <h2>Gambella City EduPortal</h2>
        <form id="loginForm">
            <input type="text" id="userId" placeholder="Enter your ID" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="message"></p>
    </div>
    <footer class="footer">
        <p>&copy; <span id="currentYear"></span> School Management System</p>
        <div class="footer-links">
            <a href="#">Privacy Policy</a> | 
            <a href="#">Help Desk</a> | 
            <a href="mailto:support@example.edu">Contact Support</a>
        </div>
    </footer>
</body>
    <script src="/assets/js/auth.js"></script>
</body>
</html>
