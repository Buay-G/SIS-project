<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Hub</title>
    <link rel="stylesheet" href="/assets/css/hub.css" />
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
  </head>
  <body>
    <div class="hub-shell">
      <!-- ============ TOP BAR ============ -->
      <header class="hub-topbar">
        <a href="/login.html" id="hub-back-link" class="hub-back-link">
          <i data-lucide="arrow-left" class="hub-icon"></i>
          <span data-i18n="hub_back_to_portal">Back to Portal</span>
        </a>
        <div class="hub-topbar-brand">
          <div class="hub-logo-badge" id="hub-logo-badge">
            <i data-lucide="school" class="hub-icon"></i>
          </div>
          <div>
            <div class="hub-school-name" id="hub-school-name">—</div>
            <div class="hub-tagline" data-i18n="hub_tagline">
              News, photos, and community updates
            </div>
          </div>
        </div>
        <div class="hub-topbar-right">
          <div
            class="lang-switch-group"
            role="tablist"
            aria-label="Language / ቋንቋ"
          >
            <button
              type="button"
              class="lang-switch-btn"
              data-lang="en"
              role="tab"
              onclick="setLang('en')"
            >
              EN
            </button>
            <button
              type="button"
              class="lang-switch-btn"
              data-lang="am"
              role="tab"
              onclick="setLang('am')"
            >
              አማ
            </button>
          </div>
          <button
            class="btn btn-accent btn-sm"
            id="hub-manage-btn"
            style="display: none"
          >
            <i data-lucide="settings" class="hub-icon hub-icon-sm"></i>
            <span data-i18n="hub_admin_existing_posts">Manage Posts</span>
          </button>
        </div>
      </header>

      <!-- ============ SECTION NAV ============ -->
      <nav
        class="hub-view-nav"
        id="hub-view-nav"
        role="tablist"
        aria-label="Hub sections"
      >
        <button
          type="button"
          class="hub-view-tab active"
          id="hub-tab-news"
          data-view="news"
          role="tab"
          aria-selected="true"
        >
          <i data-lucide="newspaper" class="hub-icon hub-icon-sm"></i>
          <span data-i18n="hub_nav_news">News</span>
        </button>
        <button
          type="button"
          class="hub-view-tab"
          id="hub-tab-gallery"
          data-view="gallery"
          role="tab"
          aria-selected="false"
        >
          <i data-lucide="image" class="hub-icon hub-icon-sm"></i>
          <span data-i18n="hub_nav_gallery">Gallery</span>
        </button>
      </nav>

      <!-- ============ STATS STRIP ============ -->
      <div class="hub-stats" id="hub-stats" style="display: none">
        <div class="hub-stat">
          <span class="hub-stat-value" id="hub-stat-students">—</span>
          <span class="hub-stat-label" data-i18n="hub_stat_students"
            >Students</span
          >
        </div>
        <div class="hub-stat">
          <span class="hub-stat-value" id="hub-stat-teachers">—</span>
          <span class="hub-stat-label" data-i18n="hub_stat_teachers"
            >Teachers</span
          >
        </div>
      </div>

      <!-- ============ LANGUAGE FILTER ============ -->
      <div class="hub-filter-row">
        <label for="hub-lang-filter" data-i18n="lang_switch_label"
          >Language</label
        >
        <select id="hub-lang-filter">
          <option value="" data-i18n="hub_all_languages">All languages</option>
          <option value="english" data-i18n="hub_lang_english">English</option>
          <option value="amharic" data-i18n="hub_lang_amharic">Amharic</option>
          <option value="nuer" data-i18n="hub_lang_nuer">Nuer</option>
          <option value="anuak" data-i18n="hub_lang_anuak">Anuak</option>
        </select>
      </div>

      <!-- ============ MAIN CONTENT ============ -->
      <main class="hub-main">
        <section class="hub-section hub-view-panel active" id="hub-view-news">
          <h2 data-i18n="hub_news_heading">News &amp; Announcements</h2>
          <div class="hub-news-layout">
            <div id="hub-announcements-list" class="hub-news-list">
              <div class="hub-loading" data-i18n="sa_loading">Loading…</div>
            </div>
            <div id="hub-announcement-detail" class="hub-news-detail">
              <div class="hub-empty" data-i18n="hub_news_select_prompt">
                Select an announcement to read it.
              </div>
            </div>
          </div>
        </section>

        <section class="hub-section hub-view-panel" id="hub-view-gallery">
          <h2 data-i18n="hub_gallery_heading">School Gallery</h2>
          <div id="hub-gallery-grid" class="hub-gallery-grid">
            <div class="hub-loading" data-i18n="sa_loading">Loading…</div>
          </div>
        </section>
      </main>

      <footer class="hub-footer" id="hub-footer">
        The creative heartbeat of this school, showcasing student storytelling,
        multimedia art, and cultural commentary.
      </footer>
    </div>

    <div id="hub-modal-root"></div>
    <div id="hub-toast-container"></div>

    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/ethiopian-calendar.js"></script>
    <script src="/assets/js/hub.js"></script>
  </body>
</html>
