<!doctype html>
<html lang="en" data-role="zonal_admins">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gambella City Education Office</title>
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/lucide@1.32.0/dist/umd/lucide.js"
      integrity="sha384-3Qyee4XMy2g+a0PvD9+WWB5qfTkKRQ61ag4BM6FpB9QhzBHJ6na9CfI3g2HsDxv6"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"
      integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
  </head>
  <body>
    <a href="#content" class="skip-link">Skip to content</a>
    <div class="nav-overlay" id="navOverlay"></div>
    <div class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-badge">
          <img
            src="/assets/images/town.jpg"
            alt=""
            class="brand-badge-img"
            id="brandBadgeImg"
            data-fallback-target="brandBadgeFallback"
          />
          <span
            class="brand-badge-fallback"
            id="brandBadgeFallback"
            style="display: none"
            >GCEO</span
          >
        </div>
        <div>
          <div class="brand-name" data-i18n="za_portal_title">
            Gambella City Education Office
          </div>
          <div class="brand-sub" data-i18n="za_brand_sub">Gambella</div>
        </div>
        <button class="nav-close-btn" id="navCloseBtn" aria-label="Close menu">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div
        class="nav-scroll"
        id="navScroll"
        role="navigation"
        aria-label="Main navigation"
      ></div>

      <div class="side-footer">
        <div class="role-card">
          <div class="role-title">
            <span id="roleTitleTxt">Head of Education</span>
          </div>
          <div class="role-id">ID <b id="roleIdTxt">GCEO-HOE-001</b></div>
        </div>
        <button class="logout-btn" id="logoutBtn">
          <i data-lucide="log-out"></i>
          <span data-i18n="za_logout">Logout</span>
        </button>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="topbar-left">
          <div class="topbar-title-row">
            <button class="nav-open-btn" id="navOpenBtn" aria-label="Open menu">
              <i data-lucide="menu"></i>
            </button>
            <h1 id="pageTitle" data-i18n="za_page_title_dashboard">
              Dashboard
            </h1>
          </div>
          <div class="badges">
            <span class="badge gold" data-i18n="za_zone_badge"
              >GAMBELLA CITY EDUC. OFFICE</span
            >
            <span class="badge" id="academicYearBadge"
              >📅 Academic Year 2018 E.C. (2025/2026 GC)</span
            >
          </div>
        </div>
        <div class="topbar-right">
          <div class="lang-toggle">
            <button class="lang-switch-btn" data-lang="en" type="button">
              EN
            </button>
            <button class="lang-switch-btn" data-lang="am" type="button">
              አማርኛ
            </button>
          </div>
          <div
            class="bell"
            id="notifBell"
            role="button"
            tabindex="0"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="notifPanel"
            aria-label="Notifications"
          >
            <i data-lucide="bell"></i
            ><span class="dot" id="notifDot" style="display: none"></span>
            <div
              class="notif-panel"
              id="notifPanel"
              role="menu"
              aria-label="Notifications"
            >
              <div class="notif-header" data-i18n="za_notifications">
                Notifications
              </div>
              <div id="notifList"></div>
            </div>
          </div>
          <div class="who">
            <button
              class="avatar profile-pic-btn"
              id="avatarInit"
              type="button"
              aria-label="Open profile settings"
              title="Profile settings"
            >
              –
            </button>
            <div>
              <div class="who-name" id="whoName">…</div>
              <div class="who-role" id="whoRole">…</div>
            </div>
          </div>
        </div>
      </div>

      <div class="content" id="content" role="main" tabindex="-1"></div>
    </div>

    <script src="/assets/js/guard.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
