<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Dashboard</title>
    <link rel="stylesheet" href="view.css">
</head>
<body>

    <h2>Registered Students Dashboard</h2>
    <input type="text" id="searchInput" placeholder="Search by ID or Name..." onkeyup="filterStudents()">
    <button id="exportBtn" onclick="exportToCSV()">Export to Excel</button>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Fayda Number</th>
                <th>Phone Number</th>
                <th>Class</th>
                <th>Stream</th>
                <th>Section</th>
            </tr>
        </thead>
        <tbody id="student-table-body">
            </tbody>
    </table>

    <script>
    // 1. Fetch and render the students
    fetch('/dashboard-data')
        .then(response => response.json())
        .then(data => {
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = ""; 
            
            data.forEach(student => {
                const fullName = `${student.first_name} ${student.middle_name || ''} ${student.last_name}`;
                
                // Create the row element properly
                const row = document.createElement('tr');
                
                // Set the search attribute for high performance
                const searchString = `${student.student_id} ${fullName} ${student.fayda_number || ''} ${student.phone_number || ''}`.toLowerCase();
                row.setAttribute('data-search', searchString);
                
                // Populate the row
                row.innerHTML = `
                    <td>${student.student_id}</td>
                    <td>${fullName}</td>
                    <td>${student.fayda_number || 'N/A'}</td>
                    <td>${student.phone_number || 'N/A'}</td>
                    <td>${student.class_level}</td>
                    <td>${student.stream}</td>
                    <td>${student.section}</td>
                `;
                
                tbody.appendChild(row);
            });
        })
        .catch(error => console.error('Error loading data:', error));

    // 2. Debounced Search Function
    let timeout = null;
    function filterStudents() {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            const input = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.getElementById("student-table-body").getElementsByTagName("tr");
            
            for (let row of rows) {
                // Get the pre-stored search string
                const searchData = row.getAttribute('data-search') || "";
                // Toggle the CSS class
                row.classList.toggle('hidden-row', !searchData.includes(input));
            }
        }, 150);
    }
    function exportToCSV() {
    const table = document.querySelector("table");
    let csv = [];
    const rows = table.querySelectorAll("tr");

    for (let row of rows) {
        const cols = row.querySelectorAll("td, th");
        let csvRow = [];
        for (let col of cols) {
            // Remove commas to prevent CSV formatting issues
            csvRow.push('"' + col.innerText.replace(/"/g, '""') + '"');
        }
        csv.push(csvRow.join(","));
    }

    const csvFile = new Blob([csv.join("\n")], { type: "text/csv" });
    const downloadLink = document.createElement("a");
    downloadLink.download = "Registered_Students.csv";
    downloadLink.href = window.URL.createObjectURL(csvFile);
    downloadLink.style.display = "none";
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
}
</script>

</body>
</html>
