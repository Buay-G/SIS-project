<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NHS FAYDA Registration</title>
    <link rel="stylesheet" href="fayda.css">
</head>
<body>

<div class="container" id="mainContainer">
    <img src="/assets/images/Logo.png" alt="NHS Logo" class="logo">
    <h2>FAYDA Registration</h2>

    <div id="formContainer">
        <form id="registrationForm">
            <input type="text" name="student_id" placeholder="Enter Your Student ID" required>
            <input type="text" name="first_name" placeholder="First Name" required>
            <input type="text" name="middle_name" placeholder="Middle Name" required>
            <input type="text" name="last_name" placeholder="Last Name" required>
            <input type="text" name="fayda_number" placeholder="FAN (16 digits)" required minlength="16" maxlength="16" pattern="\d{16}">
            <input type="tel" name="phone_number" placeholder="09XXXXXXXX" required minlength="10" maxlength="10" pattern="09[0-9]{8}">
            <input type="hidden" name="fayda_status" value="Registered">

            <label class="label-text">Grade:</label>
            <select name="class_level" id="classSelect" onchange="updateStream()" required>
                <option value="9">Grade 9</option>
                <option value="10">Grade 10</option>
                <option value="11">Grade 11</option>
                <option value="12">Grade 12</option>
            </select>

            <div class="radio-group">
                <label style="font-weight: bold; margin-right: 15px;">Sex:</label>
                <label class="radio-option"><input type="radio" name="sex" value="Male" required> Male</label>
                <label class="radio-option"><input type="radio" name="sex" value="Female" required> Female</label>
            </div>

            <label class="label-text">Stream:</label>
            <select name="stream" id="streamSelect">
                <option value="N/A">N/A</option>
            </select>

            <input type="text" name="section" placeholder="Section" minlength="1" maxlength="1" required>
            <button type="submit">Submit Details</button>
        </form>
    </div>

    <div id="successContainer" style="display: none; text-align: center;">
        <div class="circle">✓</div>
        <h2>Registration Successful!</h2>
        <a href="javascript:location.reload()" class="btn">Return to Registration</a>
    </div>
</div>

<script>
    // 1. Existing Stream Logic
    function updateStream() {
        const grade = document.getElementById('classSelect').value;
        const streamSelect = document.getElementById('streamSelect');
        streamSelect.innerHTML = (grade == "11" || grade == "12") ? 
            `<option value="Natural Science">Natural Science</option><option value="Social Science">Social Science</option>` : 
            `<option value="N/A">N/A</option>`;
    }
    updateStream();

    // 2. New Dynamic Submission Logic
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault(); // Stop page refresh
        
        const formData = new URLSearchParams(new FormData(this));

        fetch('/submit', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            // Hide form, show success container
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successContainer').style.display = 'block';
        })
        .catch(err => {
            console.error(err);
            alert("Submission failed. Please check your connection.");
        });
    });
</script>
</body>
</html>
